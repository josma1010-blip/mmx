expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
session.cookie_httponly = 1
session.use_strict_mode = 1
date.timezone = America/Mexico_City
opcache.enable = 1
opcache.validate_timestamps = 0
variables_order = "EGPCS"
